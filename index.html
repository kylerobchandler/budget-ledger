<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FAF6EE;
    --paper-line: #DDD4C2;
    --ink: #2B2622;
    --ink-soft: #6b6258;
    --ok: #3F6F52;
    --warn: #B8862E;
    --over: #A4402F;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background:
      repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 39px,
        var(--paper-line) 39px,
        var(--paper-line) 40px
      ),
      var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    padding: 32px 20px 80px;
  }

  .sheet{
    max-width: 640px;
    margin: 0 auto;
  }

  header{
    display:flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 18px;
    margin-bottom: 28px;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 2.1rem;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .period-stamp{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: 1px solid var(--ink);
    padding: 6px 10px;
    transform: rotate(-1.2deg);
    white-space: nowrap;
    color: var(--ink-soft);
  }

  .totals-row{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 36px;
  }

  .totals-row .label{
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .totals-row .value{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.6rem;
    font-weight: 600;
  }

  /* ---- Category row ---- */
  .category{
    border-bottom: 1px solid var(--paper-line);
  }

  .category-header{
    padding: 18px 0 14px;
    cursor: pointer;
    user-select: none;
  }

  .category-header:hover .category-name{
    text-decoration: underline;
    text-decoration-style: dotted;
    text-underline-offset: 3px;
  }

  .category-top{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
    gap: 12px;
  }

  .category-name-wrap{
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .category-name{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.15rem;
  }

  .chevron{
    font-size: 0.7rem;
    color: var(--ink-soft);
    transition: transform 0.25s ease;
    display: inline-block;
    line-height: 1;
  }

  .category.open .chevron{
    transform: rotate(180deg);
  }

  .category-numbers{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.95rem;
    text-align: right;
    white-space: nowrap;
  }

  .category-numbers .remaining{
    font-weight: 600;
    font-size: 1.05rem;
  }

  .category-numbers .of-limit{
    color: var(--ink-soft);
    font-size: 0.8rem;
  }

  .tally{
    position: relative;
    height: 10px;
    background: rgba(0,0,0,0.06);
    border: 1px solid var(--ink);
  }

  .tally-fill{
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 0%;
    background: var(--ok);
    transition: width 0.6s cubic-bezier(.4,0,.2,1), background-color 0.4s ease;
  }

  .tally[data-state="warn"] .tally-fill{ background: var(--warn); }
  .tally[data-state="over"] .tally-fill{
    background: var(--over);
    background-image: repeating-linear-gradient(
      135deg, rgba(255,255,255,0.25) 0 3px, transparent 3px 7px
    );
  }

  .tally-tick{
    position: absolute;
    top: -1px; bottom: -1px;
    width: 1px;
    background: var(--paper);
    opacity: 0.7;
  }

  /* ---- Transaction drawer ---- */
  .transaction-drawer{
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.35s cubic-bezier(.4,0,.2,1);
  }

  .category.open .transaction-drawer{
    max-height: 800px;
  }

  .transaction-table{
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0 18px;
    font-size: 0.85rem;
  }

  .transaction-table th{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-align: left;
    padding: 4px 8px 6px;
    border-bottom: 1px solid var(--paper-line);
    font-weight: 500;
  }

  .transaction-table th.num{ text-align: right; }

  .transaction-table td{
    padding: 7px 8px;
    border-bottom: 1px solid rgba(0,0,0,0.04);
    vertical-align: top;
  }

  .transaction-table tr:last-child td{ border-bottom: none; }

  .transaction-table td.date{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--ink-soft);
    white-space: nowrap;
    width: 72px;
  }

  .transaction-table td.reason{
    color: var(--ink);
  }

  .transaction-table td.amount{
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    text-align: right;
    white-space: nowrap;
    width: 80px;
  }

  .no-transactions{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--ink-soft);
    padding: 12px 8px 18px;
    font-style: italic;
  }

  /* ---- Misc ---- */
  .empty, .error{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.9rem;
    color: var(--ink-soft);
    padding: 40px 0;
    text-align: center;
    border: 1px dashed var(--paper-line);
  }

  .error{ color: var(--over); border-color: var(--over); }

  footer{
    margin-top: 36px;
    font-size: 0.72rem;
    color: var(--ink-soft);
    text-align: center;
    letter-spacing: 0.04em;
  }

  @media (prefers-reduced-motion: reduce){
    .tally-fill, .transaction-drawer, .chevron{ transition: none; }
  }
</style>
</head>
<body>

<div class="sheet">
  <header>
    <h1>Budget Ledger</h1>
    <div class="period-stamp" id="periodStamp">loading period&hellip;</div>
  </header>

  <div class="totals-row">
    <span class="label">Total remaining</span>
    <span class="value" id="totalRemaining">&mdash;</span>
  </div>

  <div id="categories">
    <div class="empty">Connecting to ledger&hellip;</div>
  </div>

  <footer>Click any category to see transactions &mdash; updates live from the budget form.</footer>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBnLGEF4_zrkFRVSCVVj9ZEKHxwIVaKRcA",
    authDomain: "budget-ledger-7f27d.firebaseapp.com",
    databaseURL: "https://budget-ledger-7f27d-default-rtdb.firebaseio.com",
    projectId: "budget-ledger-7f27d"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  const categoriesEl = document.getElementById('categories');
  const totalEl      = document.getElementById('totalRemaining');
  const periodEl     = document.getElementById('periodStamp');

  const money = n => `$${Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

  function fmtDate(iso){
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    return isNaN(d) ? iso : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  // Remember which categories the user has opened so re-renders don't collapse them
  const openCategories = new Set();

  onValue(ref(db, 'payPeriod'), snap => {
    const p = snap.val();
    periodEl.textContent = (p && p.start && p.end)
      ? `${fmtDate(p.start)} – ${fmtDate(p.end)}`
      : 'pay period not set';
  });

  onValue(ref(db, 'budgets'), snapshot => {
    const data = snapshot.val();

    if (!data) {
      categoriesEl.innerHTML = `<div class="empty">No categories yet.</div>`;
      totalEl.textContent = money(0);
      return;
    }

    const entries = Object.entries(data).sort((a, b) => {
      const oa = a[1].order ?? 999, ob = b[1].order ?? 999;
      return oa !== ob ? oa - ob : a[0].localeCompare(b[0]);
    });

    let totalRemaining = 0;
    categoriesEl.innerHTML = '';

    entries.forEach(([name, cat]) => {
      const limit     = Number(cat.limit)  || 0;
      const spent     = Number(cat.spent)  || 0;
      const remaining = limit - spent;
      totalRemaining += remaining;

      const pctRemaining = limit > 0 ? (remaining / limit) * 100 : 0;
      const pctSpent     = limit > 0 ? Math.min(Math.max((spent / limit) * 100, 0), 100) : 0;

      let state = 'ok';
      if (remaining < 0 || pctRemaining <= 20) state = 'over';
      else if (pctRemaining <= 45) state = 'warn';

      // Build transaction rows (newest first)
      let drawerContent;
      if (cat.transactions && Object.keys(cat.transactions).length > 0) {
        const txList = Object.values(cat.transactions)
          .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

        const rows = txList.map(tx => `
          <tr>
            <td class="date">${fmtDate(tx.date)}</td>
            <td class="reason">${tx.reason ? tx.reason : '<span style="color:var(--ink-soft)">—</span>'}</td>
            <td class="amount">${money(tx.amount)}</td>
          </tr>`).join('');

        drawerContent = `
          <table class="transaction-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Reason</th>
                <th class="num">Amount</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>`;
      } else {
        drawerContent = `<div class="no-transactions">No transactions yet this period.</div>`;
      }

      const isOpen = openCategories.has(name);

      const row = document.createElement('div');
      row.className = 'category' + (isOpen ? ' open' : '');
      row.innerHTML = `
        <div class="category-header">
          <div class="category-top">
            <span class="category-name-wrap">
              <span class="category-name">${name}</span>
              <span class="chevron">▼</span>
            </span>
            <span class="category-numbers">
              <span class="remaining">${money(remaining)}</span>
              <span class="of-limit"> left of ${money(limit)}</span>
            </span>
          </div>
          <div class="tally" data-state="${state}">
            <div class="tally-fill" style="width:${pctSpent}%"></div>
            <div class="tally-tick" style="left:25%"></div>
            <div class="tally-tick" style="left:50%"></div>
            <div class="tally-tick" style="left:75%"></div>
          </div>
        </div>
        <div class="transaction-drawer">
          ${drawerContent}
        </div>
      `;

      row.querySelector('.category-header').addEventListener('click', () => {
        const nowOpen = row.classList.toggle('open');
        nowOpen ? openCategories.add(name) : openCategories.delete(name);
      });

      categoriesEl.appendChild(row);
    });

    totalEl.textContent = money(totalRemaining);
    totalEl.style.color = totalRemaining < 0 ? 'var(--over)' : 'var(--ink)';

  }, () => {
    categoriesEl.innerHTML = `<div class="error">Couldn't load the ledger. Check your Firebase config and rules.</div>`;
  });
</script>

<!-- ===== Add Transaction button — paste this right above </body> in index.html ===== -->
<style>
  .add-tx-btn{
    position: fixed; right: 20px; bottom: 20px; z-index: 50;
    font-family: 'IBM Plex Mono', monospace; font-size: 0.95rem;
    padding: 14px 20px; border: none; border-radius: 999px;
    background: var(--ink, #222); color: var(--paper, #fff);
    box-shadow: 0 4px 14px rgba(0,0,0,.2); cursor: pointer;
  }
  .add-tx-dialog{
    border: 1px solid var(--paper-line, #ccc); border-radius: 12px;
    padding: 22px; width: min(92vw, 380px);
    background: var(--paper, #fff); color: var(--ink, #222);
    font-family: 'IBM Plex Mono', monospace;
  }
  .add-tx-dialog::backdrop{ background: rgba(0,0,0,.35); }
  .add-tx-dialog h2{ margin: 0 0 16px; font-size: 1.1rem; }
  .add-tx-dialog label{ display: block; font-size: 0.75rem; margin: 12px 0 4px;
    color: var(--ink-soft, #666); text-transform: uppercase; letter-spacing: .05em; }
  .add-tx-dialog input, .add-tx-dialog select{
    width: 100%; box-sizing: border-box; padding: 10px; font: inherit; font-size: 1rem;
    border: 1px solid var(--paper-line, #ccc); border-radius: 6px;
    background: transparent; color: inherit;
  }
  .add-tx-actions{ display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .add-tx-actions button{ font: inherit; padding: 10px 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--paper-line, #ccc); background: transparent; color: inherit; }
  .add-tx-actions button[type=submit]{ background: var(--ink, #222); color: var(--paper, #fff); border-color: transparent; }
  .add-tx-msg{ min-height: 1.2em; margin-top: 10px; font-size: 0.85rem; color: var(--over, #c0392b); }
</style>

<button class="add-tx-btn" id="addTxBtn" type="button">+ Add transaction</button>

<dialog class="add-tx-dialog" id="addTxDialog">
  <form id="addTxForm">
    <h2>Add transaction</h2>
    <label for="txCategory">Category</label>
    <select id="txCategory" required></select>
    <label for="txAmount">Amount ($)</label>
    <input id="txAmount" type="number" inputmode="decimal" step="0.01" min="0.01" required>
    <label for="txDate">Date</label>
    <input id="txDate" type="date" required>
    <label for="txReason">What was it for? (optional)</label>
    <input id="txReason" type="text" maxlength="80">
    <div class="add-tx-msg" id="txMsg"></div>
    <div class="add-tx-actions">
      <button type="button" id="txCancel">Cancel</button>
      <button type="submit" id="txSave">Save</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  // ---- Your settings ----
  var DB_URL    = 'https://budget-ledger-7f27d-default-rtdb.firebaseio.com';
  var DB_SECRET = 'YOUR_DATABASE_SECRET';   // same secret as in your Apps Script

  var btn = document.getElementById('addTxBtn');
  var dlg = document.getElementById('addTxDialog');
  var form = document.getElementById('addTxForm');
  var catSel = document.getElementById('txCategory');
  var amt = document.getElementById('txAmount');
  var dateIn = document.getElementById('txDate');
  var reason = document.getElementById('txReason');
  var msg = document.getElementById('txMsg');
  var save = document.getElementById('txSave');

  function today(){
    var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function path(name){ return name.split('/').map(encodeURIComponent).join('/'); }

  // Fill the category dropdown from Firebase, in the same order as the page
  function loadCategories(){
    return fetch(DB_URL + '/budgets.json').then(function(r){ return r.json(); }).then(function(data){
      var keep = catSel.value;
      catSel.innerHTML = '';
      Object.keys(data || {})
        .sort(function(a, b){
          var oa = (data[a] && data[a].order) || 999, ob = (data[b] && data[b].order) || 999;
          return oa !== ob ? oa - ob : a.localeCompare(b);
        })
        .forEach(function(name){
          var o = document.createElement('option'); o.value = o.textContent = name; catSel.appendChild(o);
        });
      if (keep) catSel.value = keep;
    });
  }

  btn.addEventListener('click', function(){
    msg.textContent = '';
    form.reset();
    dateIn.value = today();
    loadCategories().catch(function(){ msg.textContent = 'Could not load categories.'; });
    dlg.showModal();
    amt.focus();
  });
  document.getElementById('txCancel').addEventListener('click', function(){ dlg.close(); });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var amount = Math.round(parseFloat(amt.value) * 100) / 100;
    if (!catSel.value || !(amount > 0)) { msg.textContent = 'Pick a category and enter an amount.'; return; }

    save.disabled = true; msg.textContent = '';
    var txKey = 'tx' + Date.now() + Math.random().toString(36).slice(2, 6);
    var update = {
      spent: { '.sv': { increment: amount } },   // adds safely, even if two people save at once
    };
    update['transactions/' + txKey] = { date: dateIn.value, amount: amount, reason: reason.value.trim() };

    fetch(DB_URL + '/budgets/' + path(catSel.value) + '.json?auth=' + encodeURIComponent(DB_SECRET), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(update)
    }).then(function(r){
      if (!r.ok) throw new Error(r.status);
      dlg.close();   // the page updates by itself within a second or two
    }).catch(function(err){
      msg.textContent = err.message === '401' ? 'Secret key is wrong — check DB_SECRET.' : 'Save failed. Try again.';
    }).finally(function(){ save.disabled = false; });
  });
})();
</script>
<!-- ===== end Add Transaction ===== -->

  
</body>
</html>
